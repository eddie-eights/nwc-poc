# 検知の保存済みサーチ。結果の 1 行 = アラート 1 件（列は device / kind / target / status / detail / starts_at）で、
# アラートアクション netops_sns（bin/netops_sns.py）が SNS のトピック <接頭辞>-alerts へ publish する。
#
# 見るのは「状態が変わったこと」: SNMP のポーリング（IF の ifOperStatus。それより前の最後の値と比べる）、gNMI の on_change（BGP / IS-IS）、SNMP の trap。
# Grafana のアラートルール（app/grafana/provisioning/alerting/netops-*.yaml）も同じ 4 種類を出す。detail の末尾の「(splunk: poll)」などで、どの入力から出したかが分かる。
#
# イベントは Spark（app/spark/snmp_sinks.py の splunk_events）が HEC へ書く: source = telegraf:<measurement>、本文は
#   {"topic", "measurement", "agent_host", "tags": {…}, "fields": {…}}
#
# 窓は「索引に入った時刻」で切る（_index_earliest / _index_latest）。イベントの時刻（Telegraf の timestamp）で切ると、Spark のマイクロバッチ（60 秒）と
# 再試行で遅れて届いたイベントを取りこぼす。毎分 1 回、直前の 1 分に入ったイベントを 1 回だけ読む（ポーリングと gNMI は比べる相手として、その前も読む。ポーリングは 10 分、gNMI は 24 時間）。
# 窓を 10 秒手前にずらすのは、# 入ったばかりのイベントが検索に出るまでの間を空けるため。realtime_schedule = 0 は、スケジューラが遅れても飛ばさず順に全部の分を走らせる指定。
# 同じ対象の知らせが 1 分に何回も来たら最後の 1 つだけを出す（stats latest）。
# スケジュール実行の「いま」は予定の分（:00）なので、12:26:20 に入ったイベントは 12:27:00 の回（窓 12:25:50〜12:26:50）が 1 回だけ拾う。
# 見つけてから publish までは最大 70 秒ほど（+ Spark のマイクロバッチ）。
#
# 項目は「fields で _raw だけにしてから spath」で取る。props.conf の KV_MODE = json が検索時に同じ項目を先に取っているので、そのまま spath を重ねると
# どの項目も同じ値 2 つの多値になり、replace() などが null を返して 1 行も出なくなる（2026-10-02 に 10.4.3 で実測）。
#
# 機器名は tags.sysName > tags.agent_host > tags.source（gNMI と trap は機器の IP しか持たない。アラートアクションが DEVICE_MAP で名前に直す）。
# ポーリングと gNMI は、前の値と比べて down かどうかが変わったときだけ出す。trap は届いた知らせをそのまま出すので、同じ trap が続けて届けば同じ知らせをもう一度出す。
# 受け手は同じ知らせを何度受けてもよい作り（ワークフローの ID は異常ごとに 1 つ、status は上書き）。

# ---------------------------------------------------------------- SNMP のポーリング: IF の ifOperStatus（Telegraf が 10 秒ごとに全部の IF を読む）
# 状態をそのまま出すと毎分すべての IF の resolved を出してしまうので、down（ifOperStatus が 2）かどうかが変わった IF だけを出す（down になったら firing、
# down でなくなったら resolved）。出すかどうかを決めるのは「今の 1 分（索引の時刻で -1m@m-10s〜@m-10s）に値が入った IF」だけで、比べるのは
#   前: 今の 1 分より前（-11m@m-10s〜-1m@m-10s）に入った値のうち最後のもの
#   今: 11 分ぶん全部のうち最後の値（イベントの時刻で。送り直しの重複や遅れて届いた古い値で、状態が戻ったことにしない）
# 前を直前の 1 分だけにしないのは、Spark の HEC への書き込みが 60 秒のバッチごとに 1 回なので、境界（毎分 :50）の前後に揺れると値の無い 1 分ができるため。
# 直前の 1 分としか比べないと、その 1 分のあいだに up に戻った IF の resolved が出ず、down が続く IF の firing を出し直す（2026-10-04 のレビュー）。
# 前に値が無い IF（初めて見る IF、Telegraf や Splunk が 10 分以上止まっていたあと）は down のときだけ出す。
# starts_at は今の状態になった時刻（11 分のうち、最後に状態が変わったあとの最初の値の時刻）。同じ down を出し直しても同じ値になる（修復案の id は anomaly_id#starts_at）。
# 拾えないもの（Grafana は状態そのものを見るので、どちらも起きない）:
#   10 分を超えて値が途切れたあとも down が続いている IF は、新しい発生として firing を出し直す（starts_at も途切れたあとの最初の値になる）。
#   Splunk が止まっていて回が走らず、どの回の「今の 1 分」にもならなかった値での変化は、次に変わるまで出ない。
# 見ないもの（Grafana の link_down と同じ）: ループバック、管理ポート、サブインタフェース（"." 付き。親と同じ上げ下げ）。
# admin-state が disable（ifAdminStatus が 2）の IF は down と数えない（oper は down だが異常ではない。down のまま disable にすると resolved が出て、detail は「is admin down」）。
# target は ifName（linkDown trap と同じ anomaly_id になる）
[netops_poll]
description = Interface oper status changes (SNMP polling of ifOperStatus) -> SNS
enableSched = 1
cron_schedule = * * * * *
realtime_schedule = 0
dispatch.earliest_time = -1h
dispatch.latest_time = +5m
alert.track = 0
alert.digest_mode = 1
alert.suppress = 0
counttype = number of events
relation = greater than
quantity = 0
action.netops_sns = 1
search = index=* source="telegraf:interface" _index_earliest=-11m@m-10s _index_latest=@m-10s \
| fields _time _indextime _raw source \
| spath \
| eval device=coalesce('tags.sysName', 'tags.agent_host', 'tags.source') \
| eval target='tags.ifName', oper=tonumber('fields.ifOperStatus'), admin=coalesce(tonumber('fields.ifAdminStatus'), 1) \
| where isnotnull(device) AND isnotnull(target) AND isnotnull(oper) AND NOT match(target, "^(lo|mgmt)|[.]") \
| eval down=if(oper==2 AND admin!=2, 1, 0), in_now=if(_indextime >= relative_time(now(), "-1m@m-10s"), 1, 0) \
| eval prev_down=if(in_now==0, down, null()), down_time=if(down==1, _time, null()), up_time=if(down==0, _time, null()) \
| eventstats max(down_time) as last_down max(up_time) as last_up by device target \
| eval now_down=if(coalesce(last_down, 0) > coalesce(last_up, 0), 1, 0) \
| eval run_time=if(_time > coalesce(if(now_down==1, last_up, last_down), 0), _time, null()) \
| stats latest(prev_down) as prev_down max(now_down) as now_down max(in_now) as arrived latest(admin) as now_admin min(run_time) as starts_at by device target \
| where arrived==1 AND ((isnull(prev_down) AND now_down==1) OR (isnotnull(prev_down) AND prev_down!=now_down)) \
| eval kind="link_down", status=if(now_down==1, "firing", "resolved") \
| eval detail=target." is ".if(status=="firing", "down", if(now_admin==2, "admin down", "up"))." (splunk: poll)" \
| table device kind target status detail starts_at

# ---------------------------------------------------------------- gNMI: BGP のセッションと IS-IS の IF（on_change）
# bgp_neighbor  : tags.peer_address / fields.session_state（established 以外は bgp_down）
# isis_interface: tags.interface_name（ethernet-1/1.0 など）/ fields.oper_state（up 以外は isis_down）
# ポーリングと同じく、down かどうかが変わった対象だけを出す（down になったら firing、down でなくなったら resolved）。比べ方もポーリングと同じで、
#   前: 今の 1 分より前（-1441m@m-10s〜-1m@m-10s の 24 時間）に入った値のうち最後のもの
#   今: 読んだ全部のうち最後の値（イベントの時刻で）
# on_change は購読の直後に全部の今の状態を送り、そのあとは変わったときだけ送る（app/telegraf/telegraf.conf.in。heartbeat は付けていない）ので、値はまばらにしか来ない。
# 前を 24 時間ぶん読むのはそのため（Grafana の bgp_down / isis_down も last_over_time(...[24h]) で最後の値を見る）。
# 状態をそのまま出すと、Telegraf がつなぎ直したときや、Spark が起動して Kafka を頭から読み直したときに、up / established の resolved がまとめて出る。
# 前に値が無い対象（初めて見る、24 時間変わっていない）は down のときだけ出す。starts_at はポーリングと同じく今の状態になった時刻。detail の state は最後の値。
# 拾えないもの（Grafana はアラートごとに状態を持つので、どちらも起きない）:
#   24 時間を超えて down が続いたあとに戻ったときの resolved（前が無いので出さない）。
#   24 時間を超えて変わっていない down を Telegraf がつなぎ直して送り直すと、新しい発生として firing を出し直す（starts_at も送り直した値の時刻になる）。
[netops_gnmi]
description = BGP session / IS-IS interface state changes (gNMI on_change) -> SNS
enableSched = 1
cron_schedule = * * * * *
realtime_schedule = 0
dispatch.earliest_time = -25h
dispatch.latest_time = +5m
alert.track = 0
alert.digest_mode = 1
alert.suppress = 0
counttype = number of events
relation = greater than
quantity = 0
action.netops_sns = 1
search = index=* (source="telegraf:bgp_neighbor" OR source="telegraf:isis_interface") _index_earliest=-1441m@m-10s _index_latest=@m-10s \
| fields _time _indextime _raw source \
| spath \
| eval device=coalesce('tags.sysName', 'tags.agent_host', 'tags.source') \
| eval kind=if(source=="telegraf:bgp_neighbor", "bgp_down", "isis_down") \
| eval target=if(kind=="bgp_down", coalesce('tags.peer_address', 'tags.neighbor_peer_address'), 'tags.interface_name') \
| eval state=lower(if(kind=="bgp_down", 'fields.session_state', 'fields.oper_state')) \
| where isnotnull(device) AND isnotnull(target) AND isnotnull(state) \
| eval down=if((kind=="bgp_down" AND state=="established") OR (kind=="isis_down" AND state=="up"), 0, 1), in_now=if(_indextime >= relative_time(now(), "-1m@m-10s"), 1, 0) \
| eval prev_down=if(in_now==0, down, null()), down_time=if(down==1, _time, null()), up_time=if(down==0, _time, null()) \
| eventstats max(down_time) as last_down max(up_time) as last_up by device kind target \
| eval now_down=if(coalesce(last_down, 0) > coalesce(last_up, 0), 1, 0) \
| eval run_time=if(_time > coalesce(if(now_down==1, last_up, last_down), 0), _time, null()) \
| stats latest(prev_down) as prev_down max(now_down) as now_down max(in_now) as arrived latest(state) as state min(run_time) as starts_at by device kind target \
| where arrived==1 AND ((isnull(prev_down) AND now_down==1) OR (isnotnull(prev_down) AND prev_down!=now_down)) \
| eval status=if(now_down==1, "firing", "resolved") \
| eval detail=if(kind=="bgp_down", "bgp session to ".target." is ".state, "isis interface ".target." is ".state)." (splunk: gnmi)" \
| table device kind target status detail starts_at

# ---------------------------------------------------------------- SNMP trap
# linkDown（.1.3.6.1.6.3.1.1.5.3）は link_down の firing、linkUp（…5.4）は resolved。target は IF 名で、varbind の ifName > ifDescr > ifIndex の順に探す
# （MIB が無いと Telegraf は varbind の名前を数値 OID で書き、先頭は ".1." でなく "iso." になる。末尾には ifIndex が付く）。
# それ以外の trap は kind = trap（target は trap の OID）の firing。「直った」の知らせが無いので、下の netops_trap_clear が時間で resolved にする。
# linkDown / linkUp でも、ループバック・管理ポート・サブインタフェース（"." 付き。親と同じ上げ下げ）の IF は見ない（ポーリングと Grafana の link_down と同じ）。
# 機器が起きた知らせ（coldStart / warmStart と net-snmp の nsNotifyShutdown / nsNotifyRestart）は異常にしない。
# 知らない trap を firing にするのは、許可リストにすると知らない本物の異常を黙って捨てるため
[netops_trap]
description = SNMP traps (linkDown / linkUp and others) -> SNS
enableSched = 1
cron_schedule = * * * * *
realtime_schedule = 0
dispatch.earliest_time = -1h
dispatch.latest_time = +5m
alert.track = 0
alert.digest_mode = 1
alert.suppress = 0
counttype = number of events
relation = greater than
quantity = 0
action.netops_sns = 1
search = index=* source="telegraf:snmp_trap" _index_earliest=-1m@m-10s _index_latest=@m-10s \
| fields _time _indextime _raw source \
| spath \
| eval oid=replace(replace('tags.oid', "^iso\.", ".1."), "^1\.", ".1.") \
| where isnotnull(oid) AND oid!="" AND oid!=".1.3.6.1.6.3.1.1.5.1" AND oid!=".1.3.6.1.6.3.1.1.5.2" AND oid!=".1.3.6.1.4.1.8072.4.0.2" AND oid!=".1.3.6.1.4.1.8072.4.0.3" \
| eval device=coalesce('tags.sysName', 'tags.agent_host', 'tags.source') \
| where isnotnull(device) \
| foreach "fields.*" [ eval varbind=replace(replace("<<MATCHSTR>>", "^iso\.", ".1."), "^1\.", ".1."), \
    if_name=if(isnull(if_name) AND match(varbind, "^(ifName|\.1\.3\.6\.1\.2\.1\.31\.1\.1\.1\.1)(\.|$)"), '<<FIELD>>', if_name), \
    if_descr=if(isnull(if_descr) AND match(varbind, "^(ifDescr|\.1\.3\.6\.1\.2\.1\.2\.2\.1\.2)(\.|$)"), '<<FIELD>>', if_descr), \
    if_index=if(isnull(if_index) AND match(varbind, "^(ifIndex|\.1\.3\.6\.1\.2\.1\.2\.2\.1\.1)(\.|$)"), '<<FIELD>>', if_index) ] \
| eval kind=if(oid==".1.3.6.1.6.3.1.1.5.3" OR oid==".1.3.6.1.6.3.1.1.5.4", "link_down", "trap") \
| eval target=if(kind=="link_down", coalesce(if_name, if_descr, if_index, "?"), oid) \
| where kind!="link_down" OR NOT match(target, "^(lo|mgmt)|[.]") \
| stats latest(oid) as oid latest(_time) as starts_at by device kind target \
| eval status=if(oid==".1.3.6.1.6.3.1.1.5.4", "resolved", "firing") \
| eval detail=if(kind=="link_down", target." is ".if(status=="resolved", "up (splunk: linkUp trap)", "down (splunk: linkDown trap)"), "trap ".target." (splunk: trap)") \
| table device kind target status detail starts_at

# ---------------------------------------------------------------- trap（link 以外）を時間で閉じる
# その機器から link 以外の trap が 10 分来なければ、過去 70 分にその機器が出した trap を全部 resolved にする。
# 機器ごとに見るのは、graph の status Lambda が trap の firing で機器を ALARM に、resolved で UP にするため
# （trap の種類ごとに閉じると、別の trap がまだ新しいのに機器が UP に戻る）。
# 「10 分前の 1 分に最後の trap が入った機器」だけを拾うので、1 つの trap につき resolved は 1 回
[netops_trap_clear]
description = Resolve non-link SNMP traps of a device after 10 minutes without a new one -> SNS
enableSched = 1
cron_schedule = * * * * *
realtime_schedule = 0
dispatch.earliest_time = -3h
dispatch.latest_time = +5m
alert.track = 0
alert.digest_mode = 1
alert.suppress = 0
counttype = number of events
relation = greater than
quantity = 0
action.netops_sns = 1
search = index=* source="telegraf:snmp_trap" _index_earliest=-70m@m-10s _index_latest=@m-10s \
| fields _time _indextime _raw source \
| spath \
| eval oid=replace(replace('tags.oid', "^iso\.", ".1."), "^1\.", ".1.") \
| where isnotnull(oid) AND oid!="" AND oid!=".1.3.6.1.6.3.1.1.5.1" AND oid!=".1.3.6.1.6.3.1.1.5.2" AND oid!=".1.3.6.1.4.1.8072.4.0.2" AND oid!=".1.3.6.1.4.1.8072.4.0.3" AND oid!=".1.3.6.1.6.3.1.1.5.3" AND oid!=".1.3.6.1.6.3.1.1.5.4" \
| eval device=coalesce('tags.sysName', 'tags.agent_host', 'tags.source') \
| where isnotnull(device) \
| stats max(_indextime) as last latest(_time) as starts_at by device oid \
| eventstats max(last) as device_last by device \
| where device_last >= relative_time(now(), "-11m@m-10s") AND device_last < relative_time(now(), "-10m@m-10s") \
| eval kind="trap", target=oid, status="resolved", detail="no new trap from the device for 10 minutes (splunk: trap)" \
| table device kind target status detail starts_at
