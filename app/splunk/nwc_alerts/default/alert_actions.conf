# カスタムのアラートアクション。bin/nwc_sns.py を --execute で起こし、標準入力に JSON（results_file など）を渡す。
# Python は 3.13 と書く（latest だと Splunk を上げたとき黙って替わる）。boto3 は Splunk の Python が持っているもの（10.4.4 は 3.13 と 3.9 の両方に 1.37.14）
[nwc_sns]
python.required = 3.13
is_custom = 1
label = Publish to SNS (nwc)
description = Publish the results (device, kind, target, status, detail, starts_at) to the nwc alerts SNS topic with the ECS task role
payload_format = json
