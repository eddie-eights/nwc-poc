# SNMP を投げる対象の初期値（app/agentcore/topology.py の静的データ。Neptune が無いときのトポロジと、Neptune への「静的データを投入」の元）。
# 中身は app/containerlab/（containerlab + Nokia SR Linux。Spine-Leaf）の 7 台そのもの。
# 項目名は app/containerlab/lab_topology.py が作る形と揃える（tests/test_sync.py が lab の定義と同じであることを確かめる）。
# lab を変える（app/containerlab/gen_lab.py を打ち直す）ときはここも直す（ここが唯一のシード。lab 側にコピーは置かない）。
#
# - mgmt_ip は containerlab の mgmt ネットワーク nwc-lab（203.0.113.0/24）上のアドレス。
# - snmp_community は lab 固定の public。実機の値は書かない。
# - device_id は SR Linux の host-name（= SNMP の sysName、syslog の hostname）と同じ値。SNMP 側からも突き合わせられる。
# - 役割は名前から: s-leaf = WAN 側（上流側）の Leaf、spine、a-leaf = DC 側（アクセス側）の Leaf、trex = 4 台の leaf に 1 本ずつつながる TRex（負荷生成）。
# - links は device_id への外部キーなので、topology.json に出る機器は全部ここに要る。ポーリングしない TRex も enabled: false で行として置く。
devices:
  - device_id: dc1-s-leaf-01
    hostname: dc1-s-leaf-01
    site: dc1
    role: s-leaf
    mgmt_ip: 203.0.113.11
    snmp_version: v2c
    snmp_community: public
    snmp_port: 161
    poll_interval_seconds: 30
    enabled: true

  - device_id: dc1-s-leaf-02
    hostname: dc1-s-leaf-02
    site: dc1
    role: s-leaf
    mgmt_ip: 203.0.113.12
    snmp_version: v2c
    snmp_community: public
    snmp_port: 161
    poll_interval_seconds: 30
    enabled: true

  - device_id: dc1-spine-01
    hostname: dc1-spine-01
    site: dc1
    role: spine
    mgmt_ip: 203.0.113.21
    snmp_version: v2c
    snmp_community: public
    snmp_port: 161
    poll_interval_seconds: 30
    enabled: true

  - device_id: dc1-spine-02
    hostname: dc1-spine-02
    site: dc1
    role: spine
    mgmt_ip: 203.0.113.22
    snmp_version: v2c
    snmp_community: public
    snmp_port: 161
    poll_interval_seconds: 30
    enabled: true

  - device_id: dc1-a-leaf-01
    hostname: dc1-a-leaf-01
    site: dc1
    role: a-leaf
    mgmt_ip: 203.0.113.31
    snmp_version: v2c
    snmp_community: public
    snmp_port: 161
    poll_interval_seconds: 30
    enabled: true

  - device_id: dc1-a-leaf-02
    hostname: dc1-a-leaf-02
    site: dc1
    role: a-leaf
    mgmt_ip: 203.0.113.32
    snmp_version: v2c
    snmp_community: public
    snmp_port: 161
    poll_interval_seconds: 30
    enabled: true

  - device_id: dc1-trex-01
    hostname: dc1-trex-01
    site: dc1
    role: trex
    mgmt_ip: 203.0.113.101
    snmp_version: v2c
    snmp_community: public
    snmp_port: 161
    poll_interval_seconds: 30
    enabled: false
