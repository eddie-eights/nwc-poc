# Grafana のアラートルール（Prometheus = AMP のメトリクスを見るもの）。送り先と本文は netops.yaml。
# app/grafana/start.sh が PROMETHEUS_URL と ALERTS_TOPIC_ARN の両方があるときだけ並べる。
# どのルールもラベル kind（本文の kind）/ target（本文の target）と注釈 detail（本文の detail。末尾の「(grafana: poll)」などで、どの入力から出したかが分かる）を持つ。
# 機器名のラベル sysName は、SNMP のポーリングなら Telegraf が付け、gNMI なら Spark（app/spark/snmp_sinks.py）が device map で足す。
# 式は絞り込まず値で判定する（down の値で絞ると、直ったときに系列が消えるだけで、解消が「系列が無い評価 2 回」ぶん遅れる）。
# データが無い・クエリが失敗したときは直前の状態のまま（分からないときに発火も解消もしない）。
# 機器ごと止まって系列が途切れたときは、Grafana が古い系列として解消を送る（機器の停止はここでは検知しない）。評価は 1 分ごと（Splunk の保存済みサーチと同じ）
apiVersion: 1

groups:
  - orgId: 1
    name: nwc-prometheus
    folder: nwc-alerts
    interval: 1m
    rules:
      # ---- link_down: SNMP のポーリング（Telegraf 10 秒おき → Kafka → Spark → AMP）の ifOperStatus が 2（down）の IF。SNMP_POLL=1（既定）のときだけ値がある。
      # 見ないもの: ループバック、管理ポート、サブインタフェース（"." 付き。親と同じ上げ下げ）、admin-state が disable のポート（oper は down だが異常ではない）
      - uid: nwc-link-down
        title: link_down
        condition: C
        for: 0s
        noDataState: KeepLast
        execErrState: KeepLast
        labels:
          kind: link_down
          target: '{{ .Labels.ifName }}'
        annotations:
          detail: '{{ .Labels.ifName }} is down (grafana: poll)'
        data:
          - refId: A
            datasourceUid: amp
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: A
              expr: 'snmp_interface_ifOperStatus{ifName!~"(lo|mgmt).*|.*[.].*"} unless on (sysName, ifName) (snmp_interface_ifAdminStatus == 2)'
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: within_range
                    params: [1.5, 2.5]

      # ---- bgp_down / isis_down: gNMI の on_change（bgp_neighbor の session_state、isis_interface の oper_state）。Spark が文字列の状態を 1 / 0 の系列
      # （snmp_bgp_neighbor_session_up = established なら 1、snmp_isis_interface_oper_up = up なら 1）にして AMP に書く。0 なら発火、1 に戻れば解消。
      # on_change は変わったときにしか値が来ず、Prometheus の instant クエリは 5 分より古いサンプルを見ないので、last_over_time で直近 24 時間の最後の値を見る
      # （そのままだと落ちたまま 5 分たつと系列が消え、解消が出てしまう）。24 時間を超えて同じ状態のままだと系列が消えて解消が出る（制約）。
      # Telegraf がつなぎ直すと今の状態を全部送り直すので、普段は 24 時間で切れない
      - uid: nwc-bgp-down
        title: bgp_down
        condition: C
        for: 0s
        noDataState: KeepLast
        execErrState: KeepLast
        labels:
          kind: bgp_down
          target: '{{ .Labels.peer_address }}'
        annotations:
          detail: 'bgp session to {{ .Labels.peer_address }} is not established (grafana: gnmi)'
        data:
          - refId: A
            datasourceUid: amp
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: A
              expr: 'last_over_time(snmp_bgp_neighbor_session_up[24h])'
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [0.5]
      - uid: nwc-isis-down
        title: isis_down
        condition: C
        for: 0s
        noDataState: KeepLast
        execErrState: KeepLast
        labels:
          kind: isis_down
          target: '{{ .Labels.interface_name }}'
        annotations:
          detail: 'isis interface {{ .Labels.interface_name }} is not up (grafana: gnmi)'
        data:
          - refId: A
            datasourceUid: amp
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: A
              expr: 'last_over_time(snmp_isis_interface_oper_up[24h])'
              instant: true
              range: false
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [0.5]
