# マネージドを OSS に置き換えた環境を作る（005）のステップ 1: 手元の docker compose で、設計の「未確認」を確かめる。
# AWS には触らない。パスワードは下の試し用の値だけ（本物の値はここに書かない。ECS では ops/up.sh が SSM に作る）。
#
# 構成は docs/cycles/005-oss-on-ecs/design.md の「構成」の表と同じ台数・同じ名前。メモリが小さい手元向けに、ヒープだけ小さくしてある。
# 全部を一度に起こすとメモリ（Docker Desktop の VM）が足りないので、profile ごとに起こす:
#   kafka       Kafka 3 台（KRaft。どの台も broker と controller）
#   kafka-ui    Kafbat UI（kafka と一緒に起こす）
#   opensearch  OpenSearch 3 台（データ 2 台 + まとめ役だけの 1 台）
#   vm          VictoriaMetrics のクラスター（vminsert 1、vmselect 1、vmstorage 3、複製数 2）
#   neo4j       Neo4j Community Edition + GDS（jar はイメージに焼き込む）
#   spark       Spark 3.5（kafka、opensearch、vm と一緒に起こす）
#   vlogs       VictoriaLogs（OpenSearch が駄目だったときの切り替え先。OpenSearch が通れば使わない）
# 確かめる手順は同じディレクトリの check-*.sh。片付けは `docker compose --profile '*' down -v`。
name: nwc-oss

x-kafka-env: &kafka-env
  # 公式イメージ（apache/kafka）は KAFKA_* の環境変数を server.properties に変える。1 つでも書くと既定のファイルは使われないので、要るものは全部書く
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  # 公式イメージは storage の format を --standalone / --initial-controllers なしで打つので、controller.quorum.bootstrap.servers（動的な voter）では組めない。
  # 固定の voter（controller.quorum.voters）にする（KafkaDockerWrapper.scala のコメント "static voter configurations in Docker Hub images"）
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  CLUSTER_ID: kk8SYsQeS2ePI_Td7ELPGQ   # 3 台で同じ値（試し用。ECS では ops/up.sh が 1 回だけ作る）
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_NUM_PARTITIONS: 2   # MSK の configuration（terraform/pipeline/stream/msk.tf の num.partitions=2）と同じ。Spark の ensure_topics はこの既定で作る
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 2
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_HEAP_OPTS: -Xms384m -Xmx384m

x-opensearch-env: &opensearch-env
  cluster.name: nwc-oss
  discovery.seed_hosts: opensearch-1,opensearch-2,opensearch-cm
  cluster.initial_cluster_manager_nodes: opensearch-1,opensearch-2,opensearch-cm
  # Fargate は vm.max_map_count を変えられないので mmap を使わない（max_map_count の起動時の検査もこの設定で外れる）
  node.store.allow_mmap: "false"
  OPENSEARCH_INITIAL_ADMIN_PASSWORD: NwcOss-Trial-2026!   # 試し用（デモの証明書と一緒に、手元だけで使う）
  DISABLE_PERFORMANCE_ANALYZER_AGENT_CLI: "true"

x-vmstorage: &vmstorage
  image: victoriametrics/vmstorage:v1.153.0-cluster
  command: ["-storageDataPath=/storage", "-retentionPeriod=30d"]
  profiles: [vm, spark]
  networks: [default, isolated]

services:
  kafka-1:
    image: apache/kafka:4.3.1
    profiles: [kafka, kafka-ui, spark]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092
    volumes: [kafka-1:/var/lib/kafka/data]
    networks: [default, isolated]
  kafka-2:
    image: apache/kafka:4.3.1
    profiles: [kafka, kafka-ui, spark]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092
    volumes: [kafka-2:/var/lib/kafka/data]
    networks: [default, isolated]
  kafka-3:
    image: apache/kafka:4.3.1
    profiles: [kafka, kafka-ui, spark]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092
    volumes: [kafka-3:/var/lib/kafka/data]
    networks: [default, isolated]

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    profiles: [kafka-ui]
    environment:
      # 設計どおり、渡すのはクラスターの名前と 3 台の宛先だけ（AUTH_TYPE は書かない）
      KAFKA_CLUSTERS_0_NAME: nwc
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
    ports: ["127.0.0.1:18080:8080"]

  opensearch-1:
    image: opensearchproject/opensearch:3.9.0
    profiles: [opensearch, spark]
    environment:
      <<: *opensearch-env
      node.name: opensearch-1
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    volumes: [opensearch-1:/usr/share/opensearch/data]
    ports: ["127.0.0.1:19201:9200"]
    networks: [default, isolated]
  opensearch-2:
    image: opensearchproject/opensearch:3.9.0
    profiles: [opensearch, spark]
    environment:
      <<: *opensearch-env
      node.name: opensearch-2
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    volumes: [opensearch-2:/usr/share/opensearch/data]
    ports: ["127.0.0.1:19202:9200"]
    networks: [default, isolated]
  opensearch-cm:
    image: opensearchproject/opensearch:3.9.0
    profiles: [opensearch, spark]
    environment:
      <<: *opensearch-env
      node.name: opensearch-cm
      node.roles: cluster_manager   # まとめ役の選挙の票だけ。データを持たない（ECS でも EFS なし）
      OPENSEARCH_JAVA_OPTS: -Xms256m -Xmx256m
    ports: ["127.0.0.1:19203:9200"]
    networks: [default, isolated]

  vmstorage-1:
    <<: *vmstorage
    volumes: [vmstorage-1:/storage]
  vmstorage-2:
    <<: *vmstorage
    volumes: [vmstorage-2:/storage]
  vmstorage-3:
    <<: *vmstorage
    volumes: [vmstorage-3:/storage]
  vminsert:
    image: victoriametrics/vminsert:v1.153.0-cluster
    profiles: [vm, spark]
    command: ["-storageNode=vmstorage-1:8400,vmstorage-2:8400,vmstorage-3:8400", "-replicationFactor=2"]
    ports: ["127.0.0.1:18480:8480"]
    networks: [default, isolated]
  vmselect:
    image: victoriametrics/vmselect:v1.153.0-cluster
    profiles: [vm, spark]
    command: ["-storageNode=vmstorage-1:8401,vmstorage-2:8401,vmstorage-3:8401", "-replicationFactor=2", "-dedup.minScrapeInterval=1ms"]
    ports: ["127.0.0.1:18481:8481"]
    networks: [default, isolated]

  neo4j:
    build: ./neo4j
    image: nwc-oss-neo4j:check
    profiles: [neo4j]
    environment:
      NEO4J_AUTH: neo4j/NwcOss-Trial-2026   # 試し用
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
    # 外に出られないネットワークだけにつなぐ（起動時に GDS をダウンロードしていないことの確かめ）。cypher-shell は docker compose exec で打つ
    networks: [isolated]

  spark:
    build: ./spark
    image: nwc-oss-spark:check
    profiles: [spark]
    # 外に出られないネットワーク（isolated）だけにつなぐ。S3 Tables のカタログを試しても AWS へは届かない
    networks: [isolated]
    environment:
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_REGION: ap-northeast-1
    # ファイルでなくディレクトリでつなぐ（ファイル 1 つだと、手元で書き換えたときにコンテナから古いファイルが消えて見えなくなる）
    volumes:
      - ../../spark:/opt/check:ro
      - ./spark:/opt/oss:ro
    entrypoint: ["sleep", "infinity"]

  vlogs:
    image: victoriametrics/victoria-logs:v1.53.0   # 2026-10-05 の最新（Docker Hub。arm64 あり）。起こしてはいない
    profiles: [vlogs]
    volumes: [vlogs:/victoria-logs-data]
    ports: ["127.0.0.1:19428:9428"]

networks:
  isolated:
    internal: true

volumes:
  kafka-1:
  kafka-2:
  kafka-3:
  opensearch-1:
  opensearch-2:
  vmstorage-1:
  vmstorage-2:
  vmstorage-3:
  vlogs:
