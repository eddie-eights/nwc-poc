# カスタムのアラートアクション。bin/netops_sns.py を --execute で起こし、標準入力に JSON（results_file など）を渡す。
# Python は 3.13（app の lib/ の boto3 は 3.10 から。splunk/Dockerfile の PYTHON_VERSION と揃える。latest だと Splunk を上げたとき黙って替わる）
[netops_sns]
python.required = 3.13
is_custom = 1
label = Publish to SNS (netops)
description = Publish the results (device, kind, target, status, detail, starts_at) to the netops alerts SNS topic with the ECS task role
payload_format = json
