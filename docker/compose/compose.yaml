# 手元の docker compose で動く構成を作る（006）: WSL2（Ubuntu）の docker-ce だけで、lab → Telegraf → Kafka → Spark → 格納先 → Grafana / Splunk が一周する。
# AWS には触らない。設計は docs/cycles/006-local-compose/design.md、手順は README.md。
# containerlab（SR Linux 6 台 + VM 2 台）は compose の外（./lab.sh。sudo で app/containerlab/lab.sh を呼ぶ）。
# パスワードと token は .env（.env.example を写す。試し用の固定値）。lab の値（SNMP_AGENTS / GNMI_TARGETS / DEVICE_MAP）は値に " と , があるので
# .env に書かず、./up.sh が app/containerlab/lab_topology.py から作って環境変数で渡す（docker compose を直に打つと空のまま。Telegraf が形の検査で止まる）。
# 片付けは ./down.sh（-v で volume も消す）。
#
# 版の正（tests/test_local_compose.py が照合する）:
#   Kafka / Kafbat UI / OpenSearch  oss/compose/compose.yaml
#   Telegraf                        ops/lab-common.sh の TELEGRAF_VERSION
#   Grafana / Splunk                ops/up-common.sh の GRAFANA_VERSION / SPLUNK_VERSION
#   Prometheus                      この構成にしか無いので、ここが正
# プロジェクト名を決める（無いとディレクトリ名の compose になり、ほかの compose という名前の構成と volume の名前 compose_* がぶつかる。down.sh -v で相手のも消える）
name: nwc-local

x-kafka-env: &kafka-env
  # oss/compose/compose.yaml の x-kafka-env の写し。違いは host の Telegraf 向けの EXTERNAL リスナー（KAFKA_LISTENERS は台ごとに番号が違うので各 service へ）と、
  # トピックの自動作成（Telegraf が最初に書いたときに作る。Spark の ensure_topics も無いものを作る）
  # 公式イメージ（apache/kafka）は KAFKA_* の環境変数を server.properties に変える。1 つでも書くと既定のファイルは使われないので、要るものは全部書く
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  # 公式イメージは storage の format を --standalone / --initial-controllers なしで打つので、controller.quorum.bootstrap.servers（動的な voter）では組めない。
  # 固定の voter（controller.quorum.voters）にする（KafkaDockerWrapper.scala のコメント "static voter configurations in Docker Hub images"）
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  CLUSTER_ID: kk8SYsQeS2ePI_Td7ELPGQ   # 3 台で同じ値（試し用。ECS では ops/up.sh が 1 回だけ作る）
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_NUM_PARTITIONS: 2   # MSK の configuration（IaC/terraform/aws-managed/pipeline/stream/msk.tf の num.partitions=2）と同じ。Spark の ensure_topics はこの既定で作る
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 2
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_HEAP_OPTS: -Xms384m -Xmx384m
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

x-spark: &spark
  # docker/images/spark/Dockerfile のイメージ（Kafka の jar と app/spark/snmp_sinks.py を焼いてある。Iceberg の jar もあるが、カタログの設定は渡さない）。2 つの service で同じイメージ
  build:
    context: ../../app/spark
    dockerfile: ../../docker/images/spark/Dockerfile
  image: nwc-local-spark
  # Splunk が起きる前（起動に数分）は HEC への POST が再試行の後に落ちてジョブが終わる。起こし直して checkpoint の続きから読む（ECS のサービスの代わり）
  restart: on-failure
  depends_on: [kafka-1, kafka-2, kafka-3]

x-spark-env: &spark-env
  KAFKA_AUTH: none   # PLAINTEXT（既定の iam は MSK の IAM 認証。spark.tf と同じ）
  AWS_REGION: ap-northeast-1
  AWS_EC2_METADATA_DISABLED: "true"   # AWS の認証情報を探しに行かない（SSM も S3 も読まない）

services:
  telegraf:
    # host のネットワークで受ける（SR Linux は trap と syslog を管理ネットの GW 203.0.113.1 = WSL へ送る）。trap の 162/udp → 1162/udp は ./lab.sh up の forward が iptables で向ける。
    # 待つポート: syslog 5140/udp、trap 1162/udp、MDT 57000/tcp、ヘルスチェック 8080/tcp（host の他のプロセスとぶつかると起きない）
    build:
      context: ../../app/telegraf
      dockerfile: ../../docker/images/telegraf/Dockerfile
      args:
        TELEGRAF_VERSION: 1.40.0
    image: nwc-local-telegraf
    network_mode: host
    # Kafka が受け付ける前に起きると出力の接続で落ちるので、起こし直す
    restart: on-failure
    depends_on: [kafka-1, kafka-2, kafka-3]
    environment:
      SINK: kafka
      KAFKA_AUTH: none
      KAFKA_BROKERS: localhost:9094,localhost:9095,localhost:9096
      TELEGRAF_ROLE: all
      SYSLOG_STANDARD: RFC5424   # ops/lab-common.sh の LAB_SYSLOG_STANDARD
      SNMP_POLL: "1"
      AWS_REGION: ap-northeast-1   # telegraf.sh が必須にしている（KAFKA_AUTH=none では使わない）
      SNMP_AGENTS: ${SNMP_AGENTS:-}
      GNMI_TARGETS: ${GNMI_TARGETS:-}
      # lab の SR Linux だけの公開の既定値（ops/lab-common.sh の LAB_GNMI_USERNAME / LAB_GNMI_PASSWORD / LAB_SNMP_COMMUNITY）
      GNMI_USERNAME: admin
      GNMI_PASSWORD: NokiaSrl1!
      SNMP_COMMUNITY: public

  kafka-1:
    image: apache/kafka:4.3.1
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092,EXTERNAL://localhost:9094
    volumes: [kafka-1:/var/lib/kafka/data]
    ports: ["127.0.0.1:9094:9094"]
  kafka-2:
    image: apache/kafka:4.3.1
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9095
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092,EXTERNAL://localhost:9095
    volumes: [kafka-2:/var/lib/kafka/data]
    ports: ["127.0.0.1:9095:9095"]
  kafka-3:
    image: apache/kafka:4.3.1
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9096
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092,EXTERNAL://localhost:9096
    volumes: [kafka-3:/var/lib/kafka/data]
    ports: ["127.0.0.1:9096:9096"]

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    environment:
      # oss/compose と同じ。渡すのはクラスターの名前と 3 台の宛先だけ（AUTH_TYPE は書かない）
      KAFKA_CLUSTERS_0_NAME: nwc
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
    ports: ["127.0.0.1:18080:8080"]

  # spark-submit の引数は IaC/terraform/oss/pipeline/analytics/spark.tf の並びから、Iceberg のカタログと S3A の設定を抜いたもの。
  # checkpoint は volume（/opt/spark/work-dir はイメージに在り spark ユーザーが書ける。無いパスに付けると root のものになって書けない）
  spark-splunk:
    <<: *spark
    command: [/opt/spark/bin/spark-submit, --master, "local[*]", --driver-memory, 1024m, /opt/nwc/snmp_sinks.py,
              --bootstrap, "kafka-1:9092,kafka-2:9092,kafka-3:9092", --checkpoint, "file:///opt/spark/work-dir/checkpoint",
              --sinks, splunk, --region, ap-northeast-1, --metric-topics, "metrics,gnmi,mdt", --log-topics, "traps,logs",
              --device-map, "${DEVICE_MAP:-}",
              --splunk-hec-url, "https://splunk:8088", --splunk-skip-verify]
    environment:
      <<: *spark-env
      SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN}   # あれば SSM を読まない（--splunk-token-parameter は要らない）
    volumes: [spark-splunk-ckpt:/opt/spark/work-dir]

  spark-http:
    <<: *spark
    command: [/opt/spark/bin/spark-submit, --master, "local[*]", --driver-memory, 1024m, /opt/nwc/snmp_sinks.py,
              --bootstrap, "kafka-1:9092,kafka-2:9092,kafka-3:9092", --checkpoint, "file:///opt/spark/work-dir/checkpoint",
              --sinks, "opensearch,prometheus", --region, ap-northeast-1, --metric-topics, "metrics,gnmi,mdt", --log-topics, "traps,logs",
              --device-map, "${DEVICE_MAP:-}",
              --opensearch-endpoint, "http://opensearch:9200", --opensearch-index, snmp-logs, --prometheus-url, "http://prometheus:9090/api/v1/write"]
    environment:
      <<: *spark-env
      OPENSEARCH_AUTH: basic   # ユーザーは既定の admin
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD}
      PROMETHEUS_AUTH: none
    volumes: [spark-http-ckpt:/opt/spark/work-dir]

  opensearch:
    image: opensearchproject/opensearch:3.9.0
    environment:
      discovery.type: single-node
      # Spark と Grafana は http://opensearch:9200 に Basic 認証（snmp_sinks.py に自己署名の証明書を飛ばす設定が無い。OSS 版の opensearch.tf と同じ）
      plugins.security.ssl.http.enabled: "false"
      # mmap を使わない（vm.max_map_count の起動時の検査もこの設定で外れる。oss/compose と同じ）
      node.store.allow_mmap: "false"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_PASSWORD}
      DISABLE_PERFORMANCE_ANALYZER_AGENT_CLI: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    volumes: [opensearch:/usr/share/opensearch/data]
    ports: ["127.0.0.1:9200:9200"]

  prometheus:
    # Spark の remote write を受けるだけ（scrape は無い）。Grafana のデータソースは datasources-oss/prometheus.yaml（uid amp）
    image: prom/prometheus:v3.15.0
    command: [--config.file=/etc/prometheus/prometheus.yml, --web.enable-remote-write-receiver, --storage.tsdb.retention.time=3d]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    ports: ["127.0.0.1:9090:9090"]

  splunk:
    # 上流の splunk/splunk は amd64 だけ（WSL の x86_64 はそのまま。Apple Silicon の Mac はエミュレーションで、未確認）。standalone で app netops_alerts が動く
    build:
      context: ../../app/splunk
      dockerfile: ../../docker/images/splunk/Dockerfile
      args:
        SPLUNK_VERSION: 10.4.3
    image: nwc-local-splunk
    platform: linux/amd64
    environment:
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_GENERAL_TERMS: --accept-sgt-current-at-splunk-com
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD}
      SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN}   # 公式イメージが HEC の token を作る（TLS は既定の自己署名。Spark は --splunk-skip-verify）
      # アラートアクションが読む。ALERTS_TOPIC_ARN は渡さない（保存済みサーチは走るが、SNS への publish は失敗してログに出るだけ）
      AWS_REGION: ${AWS_REGION}
      DEVICE_MAP: ${DEVICE_MAP:-}
    volumes:
      - splunk-etc:/opt/splunk/etc
      - splunk-var:/opt/splunk/var
    # Web 8000（http）と管理 API 8089（https。./check.sh が検索を打つ）。HEC 8088 は compose のネットワークの中だけ
    ports: ["127.0.0.1:8000:8000", "127.0.0.1:8089:8089"]

  grafana:
    build:
      context: ../../app/grafana
      dockerfile: ../../docker/images/grafana/Dockerfile
      args:
        GRAFANA_VERSION: 13.2.2
    image: nwc-local-grafana
    environment:
      # app/grafana/start.sh が datasources-oss の定義を並べる（uid amp / aoss-logs。ダッシュボードはそのまま）。ALERTS_TOPIC_ARN が無いので、アラートの定義は並べない
      PROMETHEUS_AUTH: none
      OPENSEARCH_AUTH: basic
      PROMETHEUS_URL: http://prometheus:9090
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_INDEX: snmp-logs
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD}
      AWS_REGION: ${AWS_REGION}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
    volumes: [grafana:/var/lib/grafana]
    ports: ["127.0.0.1:3000:3000"]

networks:
  default:
    name: nwc-local

volumes:
  kafka-1:
  kafka-2:
  kafka-3:
  opensearch:
  prometheus:
  splunk-etc:
  splunk-var:
  grafana:
  spark-splunk-ckpt:
  spark-http-ckpt:
