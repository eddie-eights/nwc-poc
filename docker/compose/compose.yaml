# 手元の docker compose で動く構成を作る（006）: WSL2（Ubuntu）の docker-ce だけで、lab → gnmic / Telegraf → Kafka → Spark → 格納先 → Grafana / Splunk が一周する。
# AWS には触らない。設計は docs/cycles/006-local-compose/design.md、手順は README.md。
# containerlab（SR Linux 6 台 + TRex 1 台）は compose の外（./lab.sh。sudo で app/containerlab/lab.sh を呼ぶ）。
# パスワードと token は .env（.env.example を写す。試し用の固定値）。lab の値（GNMI_TARGETS / DEVICE_MAP）は値に " と , があるので
# .env に書かず、./up.sh が app/containerlab/lab_topology.py から作って環境変数で渡す（docker compose を直に打つと空のまま。gnmic が形の検査で止まる）。
# 片付けは ./down.sh（-v で volume も消す）。
#
# 版の正（tests/test_local_compose.py が照合する）:
#   Kafka / Kafbat UI / OpenSearch  ops/oss/oss-images.sh
#   Telegraf                        ops/lab-common.sh の TELEGRAF_VERSION
#   gnmic                           ops/up-common.sh の GNMIC_VERSION
#   Grafana / Splunk                ops/up-common.sh の GRAFANA_VERSION / SPLUNK_VERSION
#   syslog-ng / GoFlow2             ops/up-common.sh の SYSLOG_NG_VERSION / GOFLOW2_TAG
#   Prometheus                      この構成にしか無いので、ここが正
# プロジェクト名を決める（無いとディレクトリ名の compose になり、ほかの compose という名前の構成と volume の名前 compose_* がぶつかる。down.sh -v で相手のも消える）
name: nwc-local

x-kafka-env: &kafka-env
  # OSS 版の ECS（IaC/terraform/oss/pipeline/stream/kafka.tf の kafka_environment）と同じ値（tests/test_local_compose.py が突き合わせる）。
  # 違いは host の Telegraf・gnmic 向けの EXTERNAL リスナー（KAFKA_LISTENERS は台ごとに番号が違うので各 service へ）と、ホスト名（voter と advertised）・ヒープ・
  # 保持期間（手元は既定の 168 時間）。トピックは自動で作る（Telegraf・gnmic が最初に書いたときに作る。Spark の ensure_topics も無いものを作る）
  # 公式イメージ（apache/kafka）は KAFKA_* の環境変数を server.properties に変える。1 つでも書くと既定のファイルは使われないので、要るものは全部書く
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  # 公式イメージは storage の format を --standalone / --initial-controllers なしで打つので、controller.quorum.bootstrap.servers（動的な voter）では組めない。
  # 固定の voter（controller.quorum.voters）にする（KafkaDockerWrapper.scala のコメント "static voter configurations in Docker Hub images"）
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  CLUSTER_ID: kk8SYsQeS2ePI_Td7ELPGQ   # 3 台で同じ値（試し用。ECS では ops/up.sh が 1 回だけ作る）
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_NUM_PARTITIONS: 2   # MSK の configuration（IaC/terraform/aws-managed/pipeline/stream/msk.tf の num.partitions=2）と同じ。Spark の ensure_topics はこの既定で作る
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 2
  # 内部トピック（__consumer_offsets 等）は既定 50。PoC では 1（kafka.tf と同じ。MSK は変えられない）
  KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 1
  KAFKA_TRANSACTION_STATE_LOG_NUM_PARTITIONS: 1
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_NUM_PARTITIONS: 1
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_HEAP_OPTS: -Xms384m -Xmx384m
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

x-spark: &spark
  # docker/images/spark/Dockerfile のイメージ（Kafka の jar と app/spark/snmp_sinks.py を焼いてある。Iceberg の jar もあるが、カタログの設定は渡さない）。2 つの service で同じイメージ
  build:
    context: ../../app/spark
    dockerfile: ../../docker/images/spark/Dockerfile
  image: nwc-local-spark
  # 送り先が起きる前に始めると、送り先への POST が再試行（約 12 秒）の後に落ちてジョブが終わる。送り先は各 service の depends_on で healthy まで待つ
  # （マージキーは depends_on を混ぜないので、Kafka も含めて各 service に書く）。起きた後に落ちたら起こし直して checkpoint の続きから読む（ECS のサービスの代わり）。
  # 5 回で止める（設定の誤りで落ち続けるときに回り続けない。Docker は回数を戻さない。止まると docker/compose/check.sh が NG にする。docker/compose/README.md）
  restart: on-failure:5

x-spark-env: &spark-env
  KAFKA_AUTH: none   # PLAINTEXT（既定の iam は MSK の IAM 認証。spark.tf と同じ）
  AWS_REGION: ap-northeast-1
  AWS_EC2_METADATA_DISABLED: "true"   # AWS の認証情報を探しに行かない（SSM も S3 も読まない）

services:
  telegraf:
    # host のネットワークで受ける（SR Linux は trap を管理ネットの GW 203.0.113.1 = WSL へ送る）。trap の 162/udp → 1162/udp は ./lab.sh up の forward が iptables で向ける。
    # 待つポート: trap 1162/udp、ヘルスチェック 8080/tcp（.env の HEALTH_PORT）。host の他のプロセスとぶつかると起きない。
    # trap のポートは lab（app/containerlab/lab.sh の TRAP_PORT と SR Linux の remote-port）と揃えるので変えない。
    # syslog は syslog-ng、NetFlow / sFlow は GoFlow2 が受ける。MDT の受け口は外した（cycle 012）。受けるのは trap だけで、gNMI は gnmic のサービスが取る
    # （SNMP のポーリングと gNMI の購読は cycle 013 でやめた）
    # 待つアドレスは ./up.sh が TELEGRAF_BIND に渡す（lab の bridge があれば 203.0.113.1 だけ、無ければ空 = 全部のインターフェース）
    build:
      context: ../../app/telegraf
      dockerfile: ../../docker/images/telegraf/Dockerfile
      args:
        TELEGRAF_VERSION: 1.40.1
    image: nwc-local-telegraf
    network_mode: host
    # Kafka が受け付ける前に起きると出力の接続で落ちるので、起こし直す。5 回で止める（ポートがぶつかるなど、起こし直しても直らないとき）
    restart: on-failure:5
    depends_on: [kafka-1, kafka-2, kafka-3]
    environment:
      SINK: kafka
      KAFKA_AUTH: none
      KAFKA_BROKERS: localhost:9094,localhost:9095,localhost:9096
      AWS_REGION: ap-northeast-1   # telegraf.sh が必須にしている（KAFKA_AUTH=none では使わない）
      TELEGRAF_BIND: ${TELEGRAF_BIND:-}
      HEALTH_PORT: ${HEALTH_PORT:-8080}

  gnmic:
    # 機器の gNMI を購読して Kafka の gnmi / metrics トピックへ書く（cycle 013。docker/images/gnmic/Dockerfile。中身は app/gnmic/gnmic.sh と gnmic.yaml.in）。
    # host のネットワークで lab の管理ネット（203.0.113.0/24）の SR Linux の 57400/tcp へ繋ぐ。待ち受けるポートは無い。
    # 購読先は ./up.sh が lab の定義から作って GNMI_TARGETS に渡す（docker compose を直に打つと空のまま。gn run が形の検査で止まる）
    build:
      context: ../../app/gnmic
      dockerfile: ../../docker/images/gnmic/Dockerfile
      args:
        GNMIC_VERSION: 0.49.0
    image: nwc-local-gnmic
    network_mode: host
    # 起動の検査で止まったとき（GNMI_TARGETS が空など）に回り続けないよう 5 回で止める（Kafka が受け付ける前に起きたときの振る舞いは未確認）
    restart: on-failure:5
    depends_on: [kafka-1, kafka-2, kafka-3]
    environment:
      KAFKA_AUTH: none   # PLAINTEXT（既定の scram は MSK の SASL/SCRAM）
      KAFKA_BROKERS: localhost:9094,localhost:9095,localhost:9096
      GNMI_TARGETS: ${GNMI_TARGETS:-}
      # lab の SR Linux だけの公開の既定値（ops/lab-common.sh の LAB_GNMI_USERNAME / LAB_GNMI_PASSWORD）
      GNMI_USERNAME: admin
      GNMI_PASSWORD: NokiaSrl1!

  syslog-ng:
    # 機器の syslog を host のネットワークの 5140/udp で受けて Kafka の logs へ（cycle 012。docker/images/syslog-ng/Dockerfile。SR Linux は管理ネットの GW 203.0.113.1:5140 へ送る）。
    # 同じ番号の 5140/tcp も待つ（ECS では NLB のヘルスチェックの口）。待つアドレスは Telegraf と同じく ./up.sh の TELEGRAF_BIND。lab の SR Linux は RFC 5424 で送る
    build:
      context: ../../app/syslog-ng
      dockerfile: ../../docker/images/syslog-ng/Dockerfile
      args:
        SYSLOG_NG_VERSION: 4.29.0
    image: nwc-local-syslog-ng
    network_mode: host
    restart: on-failure:5
    depends_on: [kafka-1, kafka-2, kafka-3]
    environment:
      KAFKA_AUTH: none
      KAFKA_BROKERS: localhost:9094,localhost:9095,localhost:9096
      SYSLOG_STANDARD: RFC5424
      SYSLOG_BIND: ${TELEGRAF_BIND:-}

  goflow2:
    # NetFlow（2055/udp）と sFlow（6343/udp）を host のネットワークで受けて Kafka の flows へ JSON で書く（cycle 012）。lab の SR Linux は NetFlow を出さないので、
    # 試すときは ops/netflow_send.py で 1 つ送る。/metrics は 8081/tcp（8080 は Telegraf の health）。待つアドレスは Telegraf と同じく ./up.sh の TELEGRAF_BIND。
    # Kafka が受け付ける前に起きると 1 秒ほどで終わる（終了コード 1）ので、起こし直す。回数はほかの 5 回より多い 10 回: 5 回では Kafka を 9 秒しか待てず
    # （Mac で Kafka が受け付けるまで約 5 秒、そのあいだに 4 回起こし直した）、10 回なら起こし直しの間隔が倍々に延びて約 110 秒待つ（2026-10-08 に Kafka の無い宛先で測った）
    image: netsampler/goflow2:v2.2.7
    network_mode: host
    restart: on-failure:10
    depends_on: [kafka-1, kafka-2, kafka-3]
    command:
      - -listen=netflow://${TELEGRAF_BIND:-}:2055,sflow://${TELEGRAF_BIND:-}:6343
      - -transport=kafka
      - -transport.kafka.brokers=localhost:9094,localhost:9095,localhost:9096
      - -transport.kafka.topic=flows
      - -format=json
      - -addr=${TELEGRAF_BIND:-}:8081

  kafka-1:
    image: apache/kafka:4.3.1
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092,EXTERNAL://localhost:9094
    volumes: [kafka-1:/var/lib/kafka/data]
    ports: ["127.0.0.1:9094:9094"]
  kafka-2:
    image: apache/kafka:4.3.1
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9095
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092,EXTERNAL://localhost:9095
    volumes: [kafka-2:/var/lib/kafka/data]
    ports: ["127.0.0.1:9095:9095"]
  kafka-3:
    image: apache/kafka:4.3.1
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9096
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092,EXTERNAL://localhost:9096
    volumes: [kafka-3:/var/lib/kafka/data]
    ports: ["127.0.0.1:9096:9096"]

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    environment:
      # 渡すのはクラスターの名前と 3 台の宛先だけ（AUTH_TYPE は書かない）
      KAFKA_CLUSTERS_0_NAME: nwc
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
    ports: ["127.0.0.1:18080:8080"]

  # spark-submit の引数は IaC/terraform/oss/pipeline/analytics/spark.tf の並びから、Iceberg のカタログと S3A の設定を抜いたもの。
  # checkpoint は volume（/opt/spark/work-dir はイメージに在り spark ユーザーが書ける。無いパスに付けると root のものになって書けない）
  spark-splunk:
    <<: *spark
    command: [/opt/spark/bin/spark-submit, --master, "local[*]", --driver-memory, 1024m, /opt/nwc/snmp_sinks.py,
              --bootstrap, "kafka-1:9092,kafka-2:9092,kafka-3:9092", --checkpoint, "file:///opt/spark/work-dir/checkpoint",
              --sinks, splunk, --region, ap-northeast-1, --metric-topics, "metrics,gnmi", --log-topics, "traps,logs,flows",
              --device-map, "${DEVICE_MAP:-}",
              --splunk-hec-url, "https://splunk:8088", --splunk-skip-verify]
    environment:
      <<: *spark-env
      SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN}   # あれば SSM を読まない（--splunk-token-parameter は要らない）
    volumes: [spark-splunk-ckpt:/opt/spark/work-dir]
    depends_on:
      kafka-1: {condition: service_started}
      kafka-2: {condition: service_started}
      kafka-3: {condition: service_started}
      splunk: {condition: service_healthy}

  spark-http:
    <<: *spark
    command: [/opt/spark/bin/spark-submit, --master, "local[*]", --driver-memory, 1024m, /opt/nwc/snmp_sinks.py,
              --bootstrap, "kafka-1:9092,kafka-2:9092,kafka-3:9092", --checkpoint, "file:///opt/spark/work-dir/checkpoint",
              --sinks, "opensearch,prometheus", --region, ap-northeast-1, --metric-topics, "metrics,gnmi", --log-topics, "traps,logs,flows",
              --device-map, "${DEVICE_MAP:-}",
              --opensearch-endpoint, "http://opensearch:9200", --opensearch-index, snmp-logs, --prometheus-url, "http://prometheus:9090/api/v1/write"]
    environment:
      <<: *spark-env
      OPENSEARCH_AUTH: basic   # ユーザーは既定の admin
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD}
      PROMETHEUS_AUTH: none
    volumes: [spark-http-ckpt:/opt/spark/work-dir]
    depends_on:
      kafka-1: {condition: service_started}
      kafka-2: {condition: service_started}
      kafka-3: {condition: service_started}
      opensearch: {condition: service_healthy}
      prometheus: {condition: service_healthy}

  opensearch:
    image: opensearchproject/opensearch:3.9.0
    environment:
      discovery.type: single-node
      # Spark と Grafana は http://opensearch:9200 に Basic 認証（snmp_sinks.py に自己署名の証明書を飛ばす設定が無い。OSS 版の opensearch.tf と同じ）
      plugins.security.ssl.http.enabled: "false"
      # mmap を使わない（vm.max_map_count の起動時の検査もこの設定で外れる。IaC/terraform/oss/pipeline/analytics/opensearch.tf と同じ）
      node.store.allow_mmap: "false"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_PASSWORD}
      DISABLE_PERFORMANCE_ANALYZER_AGENT_CLI: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    volumes: [opensearch:/usr/share/opensearch/data]
    ports: ["127.0.0.1:9200:9200"]
    # spark-http が待つ。認証なしの / は起動の途中が 503、使えるようになると 401（security が認証を求める。2026-10-08 に手元の 3.9.0 で確認）
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:9200/ | grep -Eqx '200|401'"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 5m

  prometheus:
    # Spark の remote write を受けるだけ（scrape は無い）。Grafana のデータソースは datasources-oss/prometheus.yaml（uid amp）
    image: prom/prometheus:v3.15.0
    command: [--config.file=/etc/prometheus/prometheus.yml, --web.enable-remote-write-receiver, --storage.tsdb.retention.time=3d]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    healthcheck:   # spark-http が待つ
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 1m

  splunk:
    # 上流の splunk/splunk は amd64 だけ（WSL の x86_64 はそのまま。Apple Silicon の Mac はエミュレーションで立つ。034 で確かめた）。standalone で app nwc_alerts が動く
    build:
      context: ../../app/splunk
      dockerfile: ../../docker/images/splunk/Dockerfile
      args:
        SPLUNK_VERSION: 10.4.4
    image: nwc-local-splunk
    platform: linux/amd64
    environment:
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_GENERAL_TERMS: --accept-sgt-current-at-splunk-com
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD}
      SPLUNK_HEC_TOKEN: ${SPLUNK_HEC_TOKEN}   # 公式イメージが HEC の token を作る（TLS は既定の自己署名。Spark は --splunk-skip-verify）
      # アラートアクションが読む。ALERTS_TOPIC_ARN は渡さない（保存済みサーチは走るが、SNS への publish は失敗してログに出るだけ）
      AWS_REGION: ${AWS_REGION}
      DEVICE_MAP: ${DEVICE_MAP:-}
    volumes:
      - splunk-etc:/opt/splunk/etc
      - splunk-var:/opt/splunk/var
    # Web 8000（http）と管理 API 8089（https。./check.sh が検索を打つ）。HEC 8088 は compose のネットワークの中だけ
    ports: ["127.0.0.1:8000:8000", "127.0.0.1:8089:8089"]
    # spark-splunk が待つ。上流のイメージの HEALTHCHECK と同じ checkstate.sh（Ansible の構成（HEC の token を含む）が終わり、管理 API 8089 が応えれば healthy。
    # IaC/terraform/aws-managed/pipeline/analytics/splunk.tf も同じ）。起動は WSL の x86_64 で 2〜3 分、Apple Silicon のエミュレーションでも splunk だけなら 2〜3 分（034）。全部を同時に上げたときは未確認なので start_period を長めに取る
    healthcheck:
      test: ["CMD-SHELL", "/sbin/checkstate.sh"]
      interval: 15s
      timeout: 30s
      retries: 5
      start_period: 10m

  grafana:
    build:
      context: ../../app/grafana
      dockerfile: ../../docker/images/grafana/Dockerfile
      args:
        GRAFANA_VERSION: 13.2.3
    image: nwc-local-grafana
    environment:
      # app/grafana/start.sh が datasources-oss の定義を並べる（uid amp / aoss-logs。ダッシュボードはそのまま）。ALERTS_TOPIC_ARN が無いので、アラートの定義は並べない
      PROMETHEUS_AUTH: none
      OPENSEARCH_AUTH: basic
      PROMETHEUS_URL: http://prometheus:9090
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_INDEX: snmp-logs
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD}
      AWS_REGION: ${AWS_REGION}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
    volumes: [grafana:/var/lib/grafana]
    ports: ["127.0.0.1:3000:3000"]

networks:
  default:
    name: nwc-local

volumes:
  kafka-1:
  kafka-2:
  kafka-3:
  opensearch:
  prometheus:
  splunk-etc:
  splunk-var:
  grafana:
  spark-splunk-ckpt:
  spark-http-ckpt:
