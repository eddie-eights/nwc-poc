# 手元の確認（tests/）のためだけの設定。AWS に置くものは app/agentcore/requirements.txt と app/dashboard/requirements.txt。
# 使い方: uv sync --group dev --group web → bash ops/check.sh（test_nautobot は web のグループも要る）。Web を手元で動かすなら uv sync --group web
[project]
name = "nwc-poc"
version = "0.0.0"
description = "Network operations PoC: Terraform and local mock tests"
requires-python = ">=3.13,<3.14"

[dependency-groups]
dev = [
  "pyyaml>=6.0",
  # tests/test_sync.py などは app/agentcore/topology.py を差し替えずに読み、botocore.exceptions を import する（2026-10-04 に足した）
  "boto3>=1.40,<2",
  # tests/test_app.py は Strands を本物のまま動かし、boto3 のクライアントだけを差し替える（版は app/agentcore/requirements.txt と同じ）
  "strands-agents==1.57.2",
]
# 手元で app/dashboard/app.py を動かすとき（docs/development.md「Web を手元で動かす」）。中身は app/dashboard/requirements.txt と同じ
web = [
  "gradio==5.50.0",
  "boto3>=1.40,<2",
  "pyyaml>=6.0,<7",
]

[tool.uv]
package = false
